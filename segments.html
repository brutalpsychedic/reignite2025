<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Segments - Reignite 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background-color: #F7F9F9;
      color: #2C3E50;
    }
    .navbar {
      background-color: #2C3E50;
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
    }
    .navbar h1 {
      font-family: 'Montserrat', sans-serif;
      color: #F1C40F;
      font-size: 1.5rem;
      margin: 0;
    }
    .navbar nav a {
      margin-left: 20px;
      font-weight: bold;
      color: #ECF0F1;
      font-size: 0.95rem;
      text-decoration: none;
    }
    .navbar nav a:hover {
      color: #F1C40F;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2rem;
      margin-bottom: 16px;
      border-left: 6px solid #E74C3C;
      padding-left: 12px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }
    .btn-link {
      background-color: #2C3E50;
      color: white;
      border: none;
      padding: 16px 24px;
      font-size: 1.1rem;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      transition: background 0.3s ease;
    }
    .btn-link:hover {
      background-color: #E74C3C;
    }
	a {
      color: #E74C3C;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
    nav {
      margin-top: 30px;
    }
    nav a {
      color: #2C3E50;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 20px;
      border: 2px solid #2C3E50;
      border-radius: 5px;
      transition: background-color 0.3s, color 0.3s;
    }
    nav a:hover {
      background-color: #E74C3C;
      color: white;
      border-color: #E74C3C;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <h1>ReIgnite</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="segments.html">Segments</a>
      <a href="timeline.html">Timeline</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <!-- Segments -->
  <main class="container">
    <h2>Core Segments</h2>
    <div class="btn-grid">
      <a href="poster.html" class="btn-link">Poster Presentation</a>
      <a href="onstage.html" class="btn-link">On Stage Pitch</a>
      <a href="researchpaper.html" class="btn-link">Research Paper Submission</a>
    </div>

    <h2>Innovative Segments</h2>
    <div class="btn-grid">
      <a href="memebattle.html" class="btn-link">Meme Battle</a>
      <a href="abstractwriting.html" class="btn-link">Abstract Contest</a>
      <a href="stagepodcast.html" class="btn-link">Stage Podcast</a>
      <a href="infographic.html" class="btn-link">Infographic & Research Art</a>
    </div>
	<nav>
      <a href="index.html">Back to Home</a>
    </nav>
  </main>

</body>
</html>
