  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background-color: #F8F9F9;
      color: #2C3E50;
    }
    .navbar {
      background-color: #2C3E50;
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
    }
    .navbar h1 {
      font-family: 'Montserrat', sans-serif;
      color: #F1C40F;
      font-size: 1.5rem;
      margin: 0;
    }
    .navbar nav a {
      margin-left: 20px;
      font-weight: bold;
      color: #ECF0F1;
      font-size: 0.95rem;
      text-decoration: none;
    }
    .navbar nav a:hover {
      color: #F1C40F;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 24px;
      text-align: center;
    }

    h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .social-icons a {
      text-decoration: none;
      color: #2C3E50;
      font-size: 2.5rem;
      transition: transform 0.2s, color 0.2s;
    }

    .social-icons a:hover {
      color: #E74C3C;
      transform: scale(1.2);
    }

    footer {
      margin-top: 80px;
      font-size: 0.9rem;
      color: #888;
	}
	a {
      color: #E74C3C;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
    nav {
      margin-top: 30px;
    }
    nav a {
      color: #2C3E50;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 20px;
      border: 2px solid #2C3E50;
      border-radius: 5px;
      transition: background-color 0.3s, color 0.3s;
    }
    nav a:hover {
      background-color: #E74C3C;
      color: white;
      border-color: #E74C3C;
    }
  </style>
</head>
<body>

  <!-- Navbar -->

      <a href="https://linkedin.com/company/brac-university-research-for-development-club-bured" target="_blank"><i class="fab fa-linkedin"></i></a>
